name: Qualité (tests + knip + build)

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v6
      - name: Installation de Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Installation des dépendances (verrouillée)
        run: npm ci
      - name: Tests unitaires (vitest)
        run: npx vitest run --exclude '**/.claude/**'
      - name: Détection de code mort (knip)
        run: npm run knip
      - name: Construction du site (build + pages SEO)
        run: npm run build

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v6
      - name: Installation de Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Installation des dépendances (verrouillée)
        run: npm ci
      # Garde-fou : un test rouge ou du code mort bloque le déploiement.
      # Le site en ligne reste alors sur la version précédente.
      - name: Tests unitaires (vitest)
        run: npx vitest run --exclude '**/.claude/**'
      - name: Détection de code mort (knip)
        run: npm run knip
      - name: Construction du site (Build)
        run: npm run build
      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload du dossier dist
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v5

<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Zones Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #map { height: 100vh; }
    #toolbar {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: white; padding: 10px 14px; border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    #toolbar select { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font: inherit; }
    #count { font-size: 0.85rem; color: #666; margin-left: 10px; }
  </style>
</head>
<body>
  <div id="toolbar">
    <label>Zones de :</label>
    <select id="dest-select"></select>
    <label style="margin-left:14px"><input type="checkbox" id="compare-toggle"> Comparer (legacy + OSM)</label>
    <span id="count"></span>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([33.78, 10.94], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap', maxZoom: 19
    }).addTo(map);

    let currentLayers = [];
    const sel = document.getElementById('dest-select');
    const counter = document.getElementById('count');
    const compareToggle = document.getElementById('compare-toggle');

    function clearLayers() {
      currentLayers.forEach(l => map.removeLayer(l));
      currentLayers = [];
    }

    async function fetchGeo(url) {
      const res = await fetch(url);
      if (!res.ok) return null;
      return await res.json();
    }

    function makeLayer(geo, color, labelClass) {
      return L.geoJSON(geo, {
        style: { color, weight: 2, fillOpacity: 0.15, fillColor: color },
        onEachFeature: (f, l) => {
          const name = f.properties.name || '?';
          const ar = f.properties.name_ar ? `<br><span style="direction:rtl">${f.properties.name_ar}</span>` : '';
          l.bindTooltip(name, { permanent: true, direction: 'center', className: labelClass });
          l.bindPopup(`<b>${name}</b>${ar}`);
        }
      });
    }

    async function loadDest(destId) {
      clearLayers();
      const dests = await (await fetch('destinations.json')).json();
      const dest = dests.maps[destId];
      if (!dest?.zonesFile) { counter.textContent = 'Pas de zonesFile'; return; }

      const compare = compareToggle.checked;
      const layers = [];

      // Source officielle : zonesFile depuis destinations.json, dans public/
      // Le viewer est dans public/ → path relatif simple.
      const officialUrl = dest.zonesFile;
      const officialGeo = await fetchGeo(officialUrl);
      if (officialGeo) {
        const color = compare ? '#dc2626' : '#2563eb';
        const labelClass = compare ? 'zone-label zone-label-red' : 'zone-label';
        const layer = makeLayer(officialGeo, color, labelClass);
        layer.addTo(map);
        layers.push({ layer, count: officialGeo.features.length, label: dest.zonesFile });
      }

      // Source 2 : OSM admin (si compare = on et fichier OSM existe)
      let osmCount = 0;
      if (compare) {
        const osmUrl = `${destId}-zones.geojson`;
        // Si le zonesFile officiel EST déjà ce fichier OSM, on évite le doublon
        if (osmUrl !== dest.zonesFile) {
          const osmGeo = await fetchGeo(osmUrl);
          if (osmGeo) {
            const layer = makeLayer(osmGeo, '#2563eb', 'zone-label');
            layer.addTo(map);
            layers.push({ layer, count: osmGeo.features.length, label: osmUrl });
            osmCount = osmGeo.features.length;
          }
        }
      }

      currentLayers = layers.map(x => x.layer);
      counter.textContent = layers.map(x => `${x.count} (${x.label})`).join(' • ');

      // Fit bounds sur la combinaison
      if (currentLayers.length > 0) {
        const group = L.featureGroup(currentLayers);
        map.fitBounds(group.getBounds());
      }
    }

    compareToggle.addEventListener('change', () => loadDest(sel.value));

    (async () => {
      const dests = await (await fetch('destinations.json')).json();
      sel.innerHTML = '';
      Object.entries(dests.maps).forEach(([id, dest]) => {
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = dest.name;
        sel.appendChild(opt);
      });
      const params = new URLSearchParams(location.search);
      const initialDest = params.get('dest') || dests.activeMapId || Object.keys(dests.maps)[0];
      sel.value = initialDest;
      sel.addEventListener('change', () => loadDest(sel.value));
      await loadDest(initialDest);
    })();
  </script>
  <style>
    .zone-label {
      background: rgba(255,255,255,0.85); border: none; box-shadow: none;
      font-size: 0.75rem; font-weight: 600; color: #1e40af; padding: 2px 6px;
    }
    .zone-label-red { color: #b91c1c; }
  </style>
</body>
</html>
